name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.23", "1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: false

      - name: Verify go.mod is tidy
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      # The allocation gates skip under the race detector and coverage.
      - name: Test without the race detector
        run: go test -count=1 ./...

      # Every statement must run: a total of 100.0% can hide a missed block.
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26'
        run: |
          go test -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -n 1
          awk 'NR > 1 { statements[$1] = $2; hits[$1] += $3 }
            END {
              for (block in statements) {
                if (statements[block] > 0 && hits[block] == 0) {
                  print "::error::statements never ran at " block
                  missed++
                }
              }
              exit (missed > 0)
            }' coverage.out

      - name: Benchmark smoke run
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26'
        run: go test -run '^$' -bench . -benchtime 1x ./...

  # curogrpc is a separate module, which ./... in the root does not include.
  curogrpc:
    name: curogrpc (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: curogrpc
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: false

      - name: Verify go.mod is tidy
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26'
        run: |
          go test -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -n 1
          awk 'NR > 1 { statements[$1] = $2; hits[$1] += $3 }
            END {
              for (block in statements) {
                if (statements[block] > 0 && hits[block] == 0) {
                  print "::error::statements never ran at " block
                  missed++
                }
              }
              exit (missed > 0)
            }' coverage.out

      # The steps above use the root module version that curogrpc's go.mod
      # requires. This one uses the root module in this commit, so that a root
      # change that would break curogrpc fails here.
      - name: Test against the root module in this commit
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26'
        working-directory: .
        run: |
          go work init . ./curogrpc
          go test -count=1 ./curogrpc/...

  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: curo
            directory: .
          - module: curogrpc
            directory: curogrpc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ${{ matrix.directory }}
          args: --timeout=5m

  vuln:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: curo
            directory: .
          - module: curogrpc
            directory: curogrpc
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          for sha in $(git rev-list "$base..$head"); do
            if [ "$(git show -s --format='%p' "$sha" | wc -w)" -gt 1 ]; then
              continue
            fi
            if ! git show -s --format='%B' "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::commit $sha is missing a Signed-off-by line (use: git commit -s)"
              fail=1
            fi
          done
          exit $fail

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs: [test, curogrpc, lint, vuln, dco]
    if: always()
    steps:
      - name: Fail if any dependency failed or was cancelled
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
          if echo "${{ join(needs.*.result, ',') }}" | grep -qE 'failure|cancelled'; then
            echo "::error::one or more required CI jobs did not succeed"
            exit 1
          fi
