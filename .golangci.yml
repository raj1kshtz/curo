# Static checks for the mechanically enforceable parts of Curo's safety model.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - nilerr
    - noctx
    - revive
    - wastedassign

  settings:
    forbidigo:
      forbid:
        - pattern: ^panic$
          msg: "ADR-0002: library code must return errors or contain failures at an owned boundary."
        - pattern: ^os\.Exit$
          msg: "ADR-0002: library code must not terminate the host process."
        - pattern: ^log\.(Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$
          msg: "ADR-0002: library code must not terminate or unwind the host process."
        - pattern: ^time\.Sleep$
          msg: "Library waits must use cancellable, context-aware timers."
        - pattern: ^fmt\.Print.*$
          msg: "Library code must not write to the host's stdout or stderr."
      analyze-types: true

    govet:
      enable-all: true

    gosec:
      excludes:
        - G404 # math/rand is acceptable for jitter; it is not a security control.

    revive:
      rules:
        - name: exported
          disabled: false

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - forbidigo
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/raj1kshtz/curo

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
